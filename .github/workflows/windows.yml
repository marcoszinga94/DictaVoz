name: Windows installer

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Dependencias
        run: pip install -r packaging/windows/requirements-win.txt pyinstaller

      - name: Descargar whisper-cli.exe (oficial) para empaquetarlo
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $headers = @{ 'User-Agent' = 'DictaVoz' }
          if ($env:GH_TOKEN) { $headers['Authorization'] = "Bearer $env:GH_TOKEN" }
          $api = 'https://api.github.com/repos/ggml-org/whisper.cpp/releases?per_page=30'
          $rel = $null
          for ($i = 1; $i -le 4 -and -not $rel; $i++) {
            try {
              $releases = Invoke-RestMethod -Uri $api -Headers $headers -ErrorAction Stop
              $rel = $releases | Where-Object { $_.assets.name -contains 'whisper-bin-x64.zip' } | Select-Object -First 1
            } catch {
              Write-Host "Intento $i falló: $($_.Exception.Message)"
              Start-Sleep -Seconds (4 * $i)
            }
          }
          if (-not $rel) { throw 'Sin release con whisper-bin-x64.zip en whisper.cpp' }
          $asset = $rel.assets | Where-Object { $_.name -eq 'whisper-bin-x64.zip' }
          Write-Host "Usando $($rel.tag_name) / $($asset.name)"
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile whisper.zip
          Expand-Archive whisper.zip -DestinationPath _whisper_tmp -Force
          $cli = Get-ChildItem _whisper_tmp -Recurse -Filter whisper-cli.exe | Select-Object -First 1
          if (-not $cli) { throw 'whisper-cli.exe no está en el zip' }
          # Copia el exe y sus DLLs (ggml*.dll) a la misma carpeta.
          New-Item -ItemType Directory -Force -Path whisper | Out-Null
          Copy-Item (Join-Path $cli.DirectoryName '*') whisper -Recurse -Force
          "WHISPER_DIR=$env:GITHUB_WORKSPACE\whisper" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Compilar DictaVoz.exe (PyInstaller)
        env:
          WHISPER_DIR: ${{ env.WHISPER_DIR }}
        run: pyinstaller --noconfirm packaging/windows/dictavoz_win.spec

      - name: Construir el instalador (NSIS)
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          & "C:\Program Files (x86)\NSIS\makensis.exe" /V2 packaging/windows/installer.nsi

      - name: Firmar los ejecutables (autofirmada)
        shell: pwsh
        env:
          PFX_B64: ${{ secrets.CODESIGN_PFX_BASE64 }}
          PFX_PASS: ${{ secrets.CODESIGN_PFX_PASSWORD }}
        run: |
          if (-not $env:PFX_B64) {
            Write-Host 'Sin CODESIGN_PFX_BASE64 → se publica sin firmar.'
            exit 0
          }
          $bytes = [Convert]::FromBase64String($env:PFX_B64)
          $tmp = Join-Path $env:RUNNER_TEMP 'dictavoz.pfx'
          [IO.File]::WriteAllBytes($tmp, $bytes)
          $cert = Import-PfxCertificate -FilePath $tmp -CertStoreLocation Cert:\CurrentUser\My `
            -Password (ConvertTo-SecureString $env:PFX_PASS -AsPlainText -Force)
          if (-not $cert) { Write-Host 'Fallo al importar el certificado.'; exit 1 }

          # signtool (Windows SDK) es lo más fiable; si no está, Set-AuthenticodeSignature.
          $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Recurse `
            -Filter signtool.exe -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending | Select-Object -First 1
          if ($signtool) { Write-Host "Usando $($signtool.FullName)" }

          foreach ($f in @('dist\DictaVoz.exe', 'dist\DictaVoz-Setup.exe')) {
            $full = (Resolve-Path $f).Path
            if ($signtool) {
              & $signtool.FullName sign /fd SHA256 /a /f $tmp /p $env:PFX_PASS $full
              Write-Host "signtool $f exit=$LASTEXITCODE"
            } else {
              $s = Set-AuthenticodeSignature -FilePath $full -Certificate $cert -HashAlgorithm SHA256
              Write-Host "Set-AuthenticodeSignature $f -> $($s.Status) $($s.StatusMessage)"
            }
            $chk = Get-AuthenticodeSignature -FilePath $full
            Write-Host "Firma final $f -> $($chk.Status) :: $($chk.StatusMessage) :: $($chk.SignerCertificate.Subject)"
          }

      - name: Subir artefactos
        uses: actions/upload-artifact@v4
        with:
          name: DictaVoz
          path: |
            dist/DictaVoz.exe
            dist/DictaVoz-Setup.exe
          if-no-files-found: error